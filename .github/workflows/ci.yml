name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds, then runs the quality bar in scripts/verify.mjs: the WebGL
      # interface contract, the CSS hooks, accessibility and SEO structure,
      # the bundle budget, and the tripwires that fail the build if any
      # unverified business claim (years in business, project counts, awards)
      # ever makes it into the markup.
      - run: npm run check

      # Confirms the hero geometry still fits the camera frustum at every
      # target viewport after any change to the scene or frame config.
      - run: node scripts/check-framing.mjs
