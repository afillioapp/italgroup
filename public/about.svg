<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Illustration of a steel building frame under construction">
  <defs>
    <!-- Warm key light from upper left, matching the hero's lighting direction -->
    <radialGradient id="glow" cx="28%" cy="16%" r="72%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#C9A24B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground haze so the frame settles into the panel instead of floating -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1D21" stop-opacity="0"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2B2E33" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#1B1D21"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Rear frame, set back and dimmed to give the structure depth -->
  <g stroke="#2C2E33" stroke-width="5" fill="none" stroke-linecap="square" opacity="0.75">
    <path d="M215 205V845M355 205V845M495 205V845M635 205V845"/>
    <path d="M215 205H635M215 325H635M215 445H635M215 565H635M215 685H635M215 845H635"/>
  </g>

  <!-- Front frame: columns and floor beams -->
  <g stroke="#3B4854" stroke-width="9" fill="none" stroke-linecap="square">
    <path d="M165 265V905M305 265V905M445 265V905M585 265V905"/>
  </g>
  <g stroke="#454F5A" stroke-width="9" fill="none" stroke-linecap="square">
    <path d="M165 265H585M165 385H585M165 505H585M165 625H585M165 745H585"/>
  </g>

  <!-- Diagonal bracing in the outer bays -->
  <g stroke="#2C2E33" stroke-width="5" fill="none" opacity="0.9">
    <path d="M165 385L305 265M305 505L445 385M445 745L585 625M165 745L305 625"/>
  </g>

  <!-- Brass: the roof beam and one mid-height band, the single warm accent -->
  <g stroke="#C9A24B" stroke-width="10" fill="none" stroke-linecap="square">
    <path d="M165 265H585"/>
    <path d="M165 505H585" stroke-opacity="0.55"/>
  </g>

  <!-- Column feet, seated on the ground line -->
  <g fill="#C9A24B" opacity="0.85">
    <rect x="155" y="898" width="20" height="14"/>
    <rect x="295" y="898" width="20" height="14"/>
    <rect x="435" y="898" width="20" height="14"/>
    <rect x="575" y="898" width="20" height="14"/>
  </g>

  <!-- Ground line -->
  <path d="M95 905H685" stroke="#2B2E33" stroke-width="3" fill="none"/>

  <rect y="700" width="800" height="300" fill="url(#haze)"/>
</svg>
